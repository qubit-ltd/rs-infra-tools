name: Rust CI

on:
  push:
    branches: [main, dev, dev-starfish]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
      - name: Install pinned nightly components
        run: rustup toolchain install nightly-2026-06-05 --profile minimal --component rustfmt --component clippy
      - name: Build the infrastructure runtime
        run: |
          cargo build --release --locked --bin rs-infra-tools --target-dir "$RUNNER_TEMP/rs-infra-tools-target"
          echo "RS_INFRA_TOOLS_BIN=$RUNNER_TEMP/rs-infra-tools-target/release/rs-infra-tools" >> "$GITHUB_ENV"
      - run: ./.infra/bin/align-ci.sh
      - run: ./.infra/bin/ci-check.sh
