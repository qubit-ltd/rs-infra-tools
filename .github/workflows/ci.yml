name: Rust CI

on:
  push:
    branches: [main, dev, dev-starfish]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
      - name: Install pinned nightly components
        run: rustup toolchain install nightly-2026-06-05 --profile minimal --component rustfmt --component clippy
      - name: Build the infrastructure runtime
        run: |
          cargo build --release --locked --bin rs-infra-tools --target-dir "$RUNNER_TEMP/rs-infra-tools-target"
          echo "RS_INFRA_TOOLS_BIN=$RUNNER_TEMP/rs-infra-tools-target/release/rs-infra-tools" >> "$GITHUB_ENV"
      - run: ./.infra/bin/align-ci.sh
      - run: ./.infra/bin/ci-check.sh

  bootstrap-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Seed a temporary consumer project
        run: |
          repo_root=$(cygpath -u "$GITHUB_WORKSPACE")
          fixture_root="$(cygpath -u "$RUNNER_TEMP")/rs-infra-bootstrap-test"
          mkdir -p "$fixture_root"
          python_cmd=python3
          command -v "$python_cmd" >/dev/null 2>&1 || python_cmd=python
          "$python_cmd" "$repo_root/assets/project-bootstrap/sync.py" \
            --project-root "$fixture_root" \
            --package-root "$repo_root/assets/project-bootstrap" \
            --yes
          echo "BOOTSTRAP_TEST_ROOT=$fixture_root" >> "$GITHUB_ENV"
      - name: Update the consumer and its running updater from upstream
        run: |
          cd "$BOOTSTRAP_TEST_ROOT"
          bash ./update-infra.sh --yes
          bash ./update-infra.sh --check
